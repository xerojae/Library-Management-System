<!DOCTYPE html>
<html>
<head>
    <title>BSU Digital Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="auth-page">
        <div class="auth-box">
            <h1 id="auth-title">Login</h1>
            <input type="email" id="email" placeholder="BSU Email">
            <input type="password" id="pass" placeholder="Password">
            <div id="reg-fields" style="display:none;">
                <select id="userRole" onchange="toggleCodeInput()">
                    <option value="student">Student</option>
                    <option value="librarian">Librarian</option>
                </select>
                <input type="text" id="libCode" placeholder="Enter 5-min Code" style="display:none;">
            </div>
            <button class="primary-btn" onclick="handleAuth()">Enter System</button>
            <p onclick="toggleAuthMode()" style="cursor:pointer; margin-top: 15px; color: #555;">Switch Mode</p>
        </div>
    </div>

    <div id="main-system" style="display:none;">
        <header>
            <nav>
                <button onclick="showSection('search')">Search</button>
                <button onclick="showSection('faq')">FAQ</button>
                <button id="lib-nav" onclick="showSection('admin')" style="display:none;">Librarian Tools</button>
                <button onclick="location.reload()">Logout</button>
            </nav>
        </header>
        <section id="search" class="section">
            <input type="text" id="searchInput" placeholder="Search..." onkeyup="doSearch()">
            <div id="results"></div>
        </section>
        <section id="admin" class="section" style="display:none;">
            <h2>Admin Code: <span id="displayCode"></span></h2>
            <button onclick="refreshCode()">Refresh</button>
        </section>
        <section id="faq" class="section" style="display:none;">
            <h2>FAQ</h2>
            <p>Q: How do I borrow? A: Click borrow in the search results.</p>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
