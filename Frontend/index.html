<!DOCTYPE html>
<html>
<head>
    <title>BSU Digital Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="auth-page">
        <h1 id="auth-title">Login</h1>
        <select id="userRole" onchange="toggleCodeField()">
            <option value="student">Student</option>
            <option value="librarian">Librarian</option>
        </select>
        <div id="register-fields" style="display:none;">
            <input type="text" id="libCode" placeholder="Librarian Code" style="display:none;">
        </div>
        <button onclick="handleAuth()">Enter System</button>
        <p onclick="toggleAuthMode()">Switch Mode</p>
    </div>

    <div id="main-system" style="display:none;">
        <header>
            <nav id="nav-student">
                <button onclick="showSection('search')">Search</button>
                <button onclick="showSection('faq')">FAQ</button>
            </nav>
            <nav id="nav-librarian">
                <button onclick="showSection('search')">Search</button>
                <button onclick="showSection('admin')">Librarian Code</button>
            </nav>
            <button onclick="logout()">Logout</button>
        </header>

        <section id="search" class="section">
            <input type="text" id="q" onkeyup="doSearch()" placeholder="Search...">
            <div id="results"></div>
        </section>

        <section id="admin" class="section" style="display:none;">
            <h2>Librarian Dashboard</h2>
            <p>Registration Code: <b id="displayCode"></b> (Expires in 5 mins)</p>
            <button onclick="refreshCode()">Refresh Code</button>
        </section>
        
        <section id="faq" class="section" style="display:none;">
            <h2>FAQ</h2>
            <p>Q: How do I borrow? A: Click borrow in the search results.</p>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
